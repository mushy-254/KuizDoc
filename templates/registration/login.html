{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuizDoc AI - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D9;
            --secondary: #2D3748;
            --accent: #4FD1C5;
            --background: #1A202C;
            --text: #E2E8F0;
            --text-muted: #A0AEC0;
            --error: #F56565;
            --success: #48BB78;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(108, 99, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(79, 209, 197, 0.05) 0%, transparent 50%);
            background-size: 100% 100%;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .login-container {
            max-width: 480px;
            margin: auto;
            padding: 2.5rem;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(45, 55, 72, 0.95), rgba(26, 32, 44, 0.95));
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3),
                        0 0 40px rgba(108, 99, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(108, 99, 255, 0.1);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        
        .login-container:hover {
            transform: translateY(-5px);
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .logo {
            height: 80px;
            width: auto;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .login-header h1 {
            font-size: 2.2rem;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }
        
        .login-header span {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-header p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-form {
            margin-top: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.8rem;
            border-radius: 10px;
            border: 1px solid rgba(160, 174, 192, 0.2);
            background-color: rgba(45, 55, 72, 0.5);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }
        
        .login-button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(108, 99, 255, 0.25);
            position: relative;
            overflow: hidden;
        }
        
        .login-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.2), 
                transparent
            );
            transition: all 0.5s;
        }
        
        .login-button:hover:before {
            left: 100%;
        }
        
        .login-button:hover {
            background: linear-gradient(90deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(108, 99, 255, 0.3);
        }
        
        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(108, 99, 255, 0.2);
        }
        
        .login-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .login-footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--text-muted);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(160, 174, 192, 0.2);
        }
        
        .divider::before {
            margin-right: 1rem;
        }
        
        .divider::after {
            margin-left: 1rem;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background-color: rgba(45, 55, 72, 0.8);
            border: 1px solid rgba(160, 174, 192, 0.1);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .social-button:hover {
            transform: translateY(-2px);
            background-color: rgba(108, 99, 255, 0.1);
            border-color: var(--primary);
        }
        
        .ai-animation {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            animation: pulse 6s infinite alternate;
            z-index: -1;
        }
        
        .ai-animation-1 {
            top: 10%;
            left: 10%;
        }
        
        .ai-animation-2 {
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.1;
            }
        }
        
        @media (max-width: 640px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .login-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="ai-animation ai-animation-1"></div>
    <div class="ai-animation ai-animation-2"></div>
    
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="login-container">
            <div class="logo-container">
                <img src="{% static 'images/kuizdoc-logo.png' %}" alt="KuizDoc AI Logo" class="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:middle;text-anchor:middle;font-size:24px;fill:%236C63FF%22>KuizDoc</text></svg>';">
            </div>
            
            <div class="login-header">
                <h1>Welcome to <span>KuizDoc AI</span></h1>
                <p>Your AI document tutor providing personalized learning through voice conversation</p>
            </div>
            
            <form method="post" class="login-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <button type="submit" class="login-button">
                    <i class="fas fa-sign-in-alt mr-2"></i> Log In
                </button>
                
                <div class="login-footer">
                    <a href="{% url 'home' %}">Forgot password?</a>
                    <a href="{% url 'register' %}">Create account</a>
                    <a href="{% url 'home' %}">Back to home</a>
                </div>
                
                <div class="divider">Or continue with</div>
                
                <div class="social-login">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="" class="social-button">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="" class="social-button">
                        <i class="fab fa-microsoft"></i>
                    </a>
                </div>
            </form>
        </div>
    </main>
    
    <footer style="text-align: center; padding: 1rem; background-color: rgba(26, 32, 44, 0.8);">
        <div style="max-width: 1200px; margin: 0 auto;">
            <div style="margin-bottom: 0.5rem;">
                <a href="" style="color: var(--text); text-decoration: none; margin: 0 1rem;">Home</a>
                <a href="" style="color: var(--text); text-decoration: none; margin: 0 1rem;">About Us</a>
                <a href="" style="color: var(--text); text-decoration: none; margin: 0 1rem;">Contact</a>
            </div>
            <div style="color: var(--text-muted); font-size: 0.8rem;">
                &copy; {% now "Y" %} KuizDoc AI. All rights reserved.
            </div>
        </div>
    </footer>
</body>
</html>
