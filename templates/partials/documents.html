<section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Document Management Column -->
    <div class="lg:col-span-1 space-y-6">
        <!-- Upload Card -->
        <div class="dashboard-card">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-cloud-upload-alt mr-3 text-indigo-400"></i>
                Document Upload
            </h2>
            <div id="dropZone" class="upload-container group">
                <input type="file" id="documentUpload" class="hidden" accept=".pdf,.docx,.txt" multiple>
                <label for="documentUpload" class="cursor-pointer">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt text-4xl text-indigo-400 mb-4"></i>
                    </div>
                    <h3 class="upload-title text-lg font-medium mb-2">Upload Documents</h3>
                    <p class="upload-subtitle text-sm text-gray-400">
                        Drag and drop your files here or click to browse
                    </p>
                    <div class="mt-4 text-xs text-gray-500">
                        <span class="inline-flex items-center px-2 py-1 bg-gray-800/50 rounded-lg mr-2">
                            <i class="fas fa-file-pdf mr-1"></i> PDF
                        </span>
                        <span class="inline-flex items-center px-2 py-1 bg-gray-800/50 rounded-lg mr-2">
                            <i class="fas fa-file-word mr-1"></i> DOCX
                        </span>
                        <span class="inline-flex items-center px-2 py-1 bg-gray-800/50 rounded-lg">
                            <i class="fas fa-file-alt mr-1"></i> TXT
                        </span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Document List Card -->
        <div class="dashboard-card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold flex items-center">
                    <i class="fas fa-folder-open mr-3 text-indigo-400"></i>
                    Your Documents
                </h2>
                <div class="flex space-x-2">
                    <button class="p-2 hover:bg-gray-800/50 rounded-lg text-gray-400 hover:text-white">
                        <i class="fas fa-sort-alpha-down"></i>
                    </button>
                    <button class="p-2 hover:bg-gray-800/50 rounded-lg text-gray-400 hover:text-white">
                        <i class="fas fa-filter"></i>
                    </button>
                </div>
            </div>

            <div id="uploadedDocuments" class="space-y-4">
                <!-- Document items will be inserted here -->
            </div>
        </div>

        <!-- Quick Stats Card -->
        <div class="dashboard-card">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-chart-pie mr-3 text-indigo-400"></i>
                Document Stats
            </h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-gray-800/30 rounded-xl">
                    <p class="text-sm text-gray-400">Total Documents</p>
                    <p class="text-2xl font-semibold mt-1">{{ total_documents }}</p>
                </div>
                <div class="p-4 bg-gray-800/30 rounded-xl">
                    <p class="text-sm text-gray-400">Pages Analyzed</p>
                    <p class="text-2xl font-semibold mt-1">{{ total_pages }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
